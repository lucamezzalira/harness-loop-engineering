# Single source of order, tier, environment scope, blocking status, enablement
# and missing-tool policy. Filenames in checks/ carry no meaning — this file
# is authoritative.
# Every entry requires: name, tier, where, blocking, enabled, missing.
# where: [local], [ci], or [local, ci]
# missing: skip | warn | exit2 | n/a

sensors:
