providers:
  anthropic:
    type: api
  local:
    type: openai-compatible
    baseUrl: http://localhost:11434/v1

tiers:
  deep:
    provider: anthropic
    id: claude-opus-5
  balanced:
    provider: anthropic
    id: claude-sonnet-5
  fast:
    provider: anthropic
    id: claude-haiku-4-5-20251001
  # Pin local Ollama tags in harness.local.yaml if you override these.
  local-deep:
    provider: local
    id: qwen3.6:27b
  local-fast:
    provider: local
    id: qwen3:8b

profiles:
  default:
    planner: deep
    reviewer: deep
    security: deep
    product: balanced
    infra: balanced
    test-writer: balanced
    qa: fast
  offline:
    planner: local-deep
    reviewer: local-deep
    security: local-deep
    product: local-deep
    infra: local-fast
    test-writer: local-fast
    qa: local-fast
  # Local panels + host-tool implementers. Switch via harness.local.yaml `profile:`.
  # Requires Ollama at localhost:11434 with the local-deep / local-fast tags above.
  # Keep edit-capable roles on a host tool (Cursor Auto / Claude CLI) so they can
  # write the tree; local models review only.
  hybrid-local:
    planner: local-deep
    reviewer: local-deep
    security: local-deep
    product: local-deep
    infra: local-fast
    test-writer: local-fast
    qa: local-fast
  cheap:
    planner: deep
    reviewer: balanced
    security: deep
    product: fast
    infra: fast
    test-writer: fast
    qa: fast
