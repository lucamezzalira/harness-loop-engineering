name: Harness CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      HARNESS_ENV: ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Install semgrep
        run: pip install --user semgrep
      - name: Unit tests
        run: npm test
      - name: Hook fail-open
        run: |
          out=$(echo '{}' | ./verify.sh --hook 2>/dev/null)
          echo "$out" | grep -q failOpen
          test "$(echo '{}' | ./verify.sh --hook >/dev/null 2>&1; echo $?)" -eq 0
      - name: Render requires tool
        run: |
          rm -f harness.local.yaml
          ./verify.sh --render && exit 1 || test $? -eq 2
      - name: Render wires portable four (hooks on)
        run: |
          cp harness.local.yaml.example harness.local.yaml
          ./verify.sh --render
          test -f .cursor/hooks/before-shell.sh
          test -f .cursor/hooks.json
          grep -q sessionStart .cursor/hooks.json
          grep -q beforeShellExecution .cursor/hooks.json
          grep -q afterFileEdit .cursor/hooks.json
          grep -q '"stop"' .cursor/hooks.json
          ! grep -q beforeMCPExecution .cursor/hooks.json
          ! test -f .cursor/hooks/before-shell.mjs
          ! test -f .cursor/hooks/before-mcp.sh
      - name: Status shows enforcement on
        run: |
          ./verify.sh --status | head -4 | grep -q 'enforcement: on'
          ./verify.sh --status | grep -q 'env: ci'
      - name: Example estate tests
        run: |
          cd examples/two-services
          npm install
          npm test
      - name: Help and version
        run: |
          ./verify.sh --help
          ./verify.sh --version
      - name: Flag errors
        run: |
          ./verify.sh --edit --turn && exit 1 || test $? -eq 2
          ./verify.sh --nope && exit 1 || test $? -eq 2
      - name: Verify (edit tier)
        run: ./verify.sh --edit || true
      - name: Verify (turn tier)
        run: ./verify.sh --turn
      - name: Verify (commit tier)
        run: ./verify.sh
      - name: Agent commit refused via hook
        run: |
          set +e
          echo '{"command":"git commit -m x"}' | bash .cursor/hooks/before-shell.sh >/dev/null
          code=$?
          set -e
          test "$code" -eq 2
